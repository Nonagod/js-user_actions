<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
  <script src="../dist/user_actions.min.js"></script>
</head>
<body>
<button id="double">Задублированный запрос</button>
<button id="emulate">Эмулировать (перезагрузка)</button>
<button id="handlers">Свои обработчики</button>
<!-- c сервера (можно локального, НО сервера) -->
<button id="send">Отправить</button>
<script>
    let _handlers = {
        double: () => {
            console.info('ДУБЛИРОВАНИЕ ЗАПРОСОВ');
            window.UserAction.do( 'test', {});
            window.UserAction.do( 'test', {});
        },
        emulate: () => {
            console.info('ЭМУЛЯЦИЯ');
            UserAction.enableEmulation();
            UserAction.Emulator.add('test',
                {
                    data: {error: 1},
                },
                {
                    status: false,
                    result: {
                        code: 'HAPPENED',
                        msg: "Произошло...",
                        info: {
                            some: "Дополнительная информация, если есть"
                        }
                    }
                }
            );
            UserAction.Emulator.add('test',
                {
                    data: {
                        error: 0
                    }
                },
                {
                    status: true,
                    result: {
                        data: 'данные по соглашению'
                    }
                }
            );
            _handlers.send();
        },
        send: () => {
            console.info('ОТПРАВКА НА ORIGIN');
            window.UserAction.do( 'test', {
                data: {error: 0},
                url: 'https://blockster-ext.websterstd.ru'
            });
            /*ошибка*/window.UserAction.do( 'test', {
                data: {error: 1},
                url: 'https://blockster-ext.websterstd.ru'
            });
        },
        handlers: () => {
            console.info('СВОИ ОБРАБОТЧИКИ с ФАЙЛАМИ');

            window.UserAction.do( 'test', {
                data: {error: 0, file: new File([ "foo" ], "foo.txt", { type: "text/plain" })},
                handleSuccess: (data) => { alert( 'Для запроса, успех: ' + data); },
                url: 'https://blockster-ext.websterstd.ru/'
            });
            /*ошибка*/window.UserAction.do( 'test', {
                data: {error: 1, file: new File([ "foo" ], "foo.txt", { type: "text/plain" })},
                handleError: (Error) => { alert( 'Для запроса, ошибка: ' + Error.message); },
                url: 'https://blockster-ext.websterstd.ru/'
            });

            /* замена по умолчанию */
            UserAction.handleSuccessDefault = (data) => { alert( 'По умол., успех: ' + data); };
            UserAction.handleErrorDefault = (Error) => { alert( 'Для умол., ошибка: ' + Error.message); };


            window.UserAction.do( 'test', {
                data: {error: 0, file: new File([ "foo2" ], "foo.txt", { type: "text/plain" })},
                url: 'https://blockster-ext.websterstd.ru/'
            });
            /*ошибка, дубль*/window.UserAction.do( 'test', {
                data: {error: 1, file: new File([ "foo" ], "foo.txt", { type: "text/plain" })},
                url: 'https://blockster-ext.websterstd.ru/'
            });

        },
    }

    window.addEventListener( 'load', () => {
        for( let [i, el] of Object.entries( document.querySelectorAll( 'button' ) )) {
            el.addEventListener( 'click', _handlers[ el.id ]);
        }
    });

</script>

</body>
</html>
